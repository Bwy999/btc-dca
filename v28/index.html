<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4a40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="sats-garden-v28" content="28.0.0-preview2">
<title>Sats Garden</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
/* Sats Garden V28 —— 设计规范（全站只用这一套）
   颜色：墨绿 moss（顶部背景）· 纸 paper（内容区）· 墨 ink（文字三级）· 橙 orange（只用于「现在的位置」和当前导航）
   字体：数字与结论用衬线（iPhone 自带 New York / 宋体），其余用系统黑体
   形状：内容区是一张从下方浮上来的纸，上边圆角 32px；行与行之间用细线，不用卡片 */
:root{
  --moss:#16362f;--moss2:#1f4a40;--paper:#f4f5f2;--ink:#161a18;--ink2:#5b625e;--ink3:#8d948f;--hair:rgba(22,26,24,.10);
  --orange:#f7931a;--pos:#1f9d6b;--neg:#d6453d;--cau:#c77a12;--on:#f3f6f3;--on2:rgba(243,246,243,.68);--on3:rgba(243,246,243,.5);
  --serif:ui-serif,"New York","Songti SC","Noto Serif CJK SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Helvetica Neue",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121916;--ink:#eef2ef;--ink2:#a4ada8;--ink3:#737b76;--hair:rgba(255,255,255,.10);--moss:#12302a;--moss2:#1a4239;--pos:#3fc48f;--neg:#ff7a70}}
:root[data-theme="dark"]{--paper:#121916;--ink:#eef2ef;--ink2:#a4ada8;--ink3:#737b76;--hair:rgba(255,255,255,.10);--moss:#12302a;--moss2:#1a4239;--pos:#3fc48f;--neg:#ff7a70}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--moss)}
body{min-height:100vh;min-height:100dvh;background:var(--moss);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--moss)}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.view[hidden]{display:none}
/* 顶部 */
.hero{background:linear-gradient(168deg,var(--moss2),var(--moss) 62%);color:var(--on);padding:calc(var(--safe-t) + 22px) 24px 58px}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--on2)}
.hero .top b{color:var(--on);font-weight:600;letter-spacing:.02em}
.price{font-size:clamp(46px,15vw,60px);line-height:1;font-weight:600;letter-spacing:-.02em;margin:26px 0 8px}
.price sup{font-size:.38em;font-weight:400;vertical-align:top;position:relative;top:.16em;margin-right:3px;opacity:.7}
.chg{font-size:13px;color:var(--on2);min-height:18px}.chg b{font-weight:600}.chg .dn{color:#ffb4ac}.chg .up{color:#a9e3cb}
.ruler{margin-top:28px}
.ruler .now{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.ruler .now b{font-size:26px;font-weight:600}.ruler .now span{font-size:14px;color:#bfe8d6;font-weight:600}.ruler .now em{font-style:normal;font-size:12px;color:var(--on3);margin-left:auto}
.ruler .bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,#3fbf8f 0 22%,#9fd3b9 22% 46%,#e9d9a8 46% 72%,#e7a070 72% 100%)}
.ruler .mk{position:absolute;top:-7px;width:2px;height:20px;margin-left:-1px;background:var(--orange);border-radius:1px;left:0;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.ruler .mk::after{content:"";position:absolute;left:-4px;top:-9px;width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(247,147,26,.25)}
.ruler .lab{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--on3)}
/* 纸 */
.sheet{position:relative;margin-top:-32px;background:var(--paper);border-radius:32px 32px 0 0;min-height:calc(100dvh - 300px);padding:30px 24px calc(120px + var(--safe-b));box-shadow:0 -14px 34px rgba(8,22,18,.22)}
.sheet::before{content:"";position:absolute;top:10px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--hair)}
.verdict{font-family:var(--serif);font-size:30px;line-height:1.28;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.note{margin-top:10px;font-size:13px;color:var(--pos);font-weight:600;display:flex;align-items:center;gap:7px}.note::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.note.warn{color:var(--cau)}.note.bad{color:var(--neg)}
.rows{margin-top:22px;border-top:1px solid var(--hair)}
.r{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--hair);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:56px}
.r dt,.r .k{font-size:12.5px;color:var(--ink3)}
.r .v b{font-size:16px;font-weight:650}.r .v span{display:block;font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.r .v b .amt{display:inline;font-size:22px;font-weight:600;color:var(--ink);margin:0;line-height:1.2}
.r .v b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
.r .go{color:var(--ink3);font-size:18px}
.tag{display:inline-block;margin-left:10px;padding:3px 9px;border-radius:999px;font-style:normal;font-size:11.5px;font-weight:600;white-space:nowrap;background:rgba(247,147,26,.14);color:#b9690a;vertical-align:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#ffb866}}
:root[data-theme="dark"] .tag{color:#ffb866}
.meta{margin-top:18px;font-size:11.5px;color:var(--ink3);line-height:1.6}
.meta a{color:inherit}
/* 定投页 */
.hero.dca{text-align:center;padding-bottom:54px}
.ring{position:relative;width:176px;height:176px;margin:18px auto 14px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center}.ring small{display:block;font-size:12px;color:var(--on2)}.ring b{display:block;font-size:36px;font-weight:600;margin:4px 0}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);gap:2px;padding:3px;border-radius:14px;background:rgba(255,255,255,.10);font-size:12px;color:var(--on2)}
.seg span{padding:7px 14px;border-radius:11px}.seg .on{background:var(--on);color:#16362f;font-weight:700}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:16px;border:0;background:var(--ink);color:var(--paper);font:inherit;font-size:16px;font-weight:650;text-decoration:none;cursor:pointer}
.h{font-size:12.5px;color:var(--ink3);margin:22px 0 2px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);font-size:15px}
.kv span small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}.kv b{font-size:17px;white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;align-items:end}
.cmp .barv{border-radius:8px 8px 0 0;min-height:6px;background:var(--hair)}.cmp .mine .barv{background:var(--moss2)}
.cmp small{display:block;font-size:11.5px;color:var(--ink3);margin-top:6px}.cmp b{display:block;font-size:17px;margin-top:2px}
.cmpn{margin-top:10px;font-size:13px;color:var(--ink2)}.cmpn b{color:var(--pos)}.cmpn b.dn{color:var(--neg)}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--hair);font-size:14px}
.rec small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}.rec button{border:0;background:none;color:var(--ink3);font:inherit;font-size:12px;padding:8px 0 8px 8px;cursor:pointer}
.more{display:block;width:100%;padding:14px 0;border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;text-align:center;cursor:pointer}
.links{display:flex;gap:18px;margin-top:6px;font-size:12.5px}.links button{border:0;background:none;color:var(--ink3);font:inherit;padding:10px 0;cursor:pointer;text-decoration:underline}
/* 记录面板 */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,22,18,.5);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.panel{width:100%;max-width:480px;background:var(--paper);border-radius:28px 28px 0 0;padding:22px 24px calc(22px + var(--safe-b))}
.panel h3{font-family:var(--serif);font-size:22px;margin-bottom:14px}
.f{display:block;margin-bottom:12px}.f span{display:block;font-size:12px;color:var(--ink3);margin-bottom:6px}
.f input{width:100%;height:50px;border-radius:14px;border:1px solid var(--hair);background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:0 14px;font-variant-numeric:tabular-nums}
.f input:focus{outline:2px solid var(--orange);outline-offset:1px}
.hint{font-size:12px;color:var(--ink3);margin:-4px 0 14px}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}.btns .ghost{background:var(--hair);color:var(--ink)}
.soon{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--hair);font-size:13px;color:var(--ink2);line-height:1.55}
/* 底部导航 */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));height:58px;padding:0 8px;border-radius:29px;background:#161a18;display:flex;align-items:center;gap:2px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs{background:#1c2622}}
:root[data-theme="dark"] .tabs{background:#1c2622}
.tabs button{width:72px;height:50px;border:0;background:none;color:rgba(255,255,255,.5);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.tabs button.on{color:#fff}.tabs svg{display:block;margin:0 auto 3px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on svg{stroke:var(--orange)}
.skel{display:inline-block;min-width:3em;border-radius:6px;background:currentColor;opacity:.12;color:inherit}
@media (prefers-reduced-motion:reduce){.ruler .mk{transition:none}}
button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
</style>
</head>
<body>
<div class="app">

<section class="view" id="vHome">
  <div class="hero">
    <div class="top"><b>Sats Garden</b><span id="hDate"></span></div>
    <div class="price num"><sup>$</sup><span id="hPrice"><i class="skel">&nbsp;</i></span></div>
    <div class="chg" id="hChg"></div>
    <div class="ruler">
      <div class="now"><b class="num" id="hAhr">—</b><span id="hAhrZone"></span><em>AHR999</em></div>
      <div class="bar"><div class="mk" id="hMark"></div></div>
      <div class="lab"><span>深度低估</span><span>低估</span><span>合理</span><span>昂贵</span></div>
    </div>
  </div>
  <div class="sheet">
    <div class="verdict" id="hVerdict">正在读取…</div>
    <div class="note" id="hNote" hidden></div>
    <div class="rows">
      <button class="r" type="button" data-go="ind"><span class="k">贵不贵</span><span class="v"><b id="q1">—</b><span id="q1s"></span></span><span class="go">›</span></button>
      <button class="r" type="button" data-go="dca"><span class="k">投多少</span><span class="v"><b><span class="num amt" id="q2">—</span><em class="tag" id="q2t" hidden></em></b><span id="q2s"></span></span><span class="go">›</span></button>
      <button class="r" type="button" data-go="ind"><span class="k">要留意</span><span class="v"><b id="q3">—</b><span id="q3s"></span></span><span class="go">›</span></button>
    </div>
    <p class="meta" id="hMeta"></p>
  </div>
</section>

<section class="view" id="vDca" hidden>
  <div class="hero dca">
    <div class="top"><b id="dMonth"></b><span id="dZone"></span></div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"/><circle id="dArc" cx="50" cy="50" r="45" fill="none" stroke="#f7931a" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 283"/></svg>
      <div class="in"><div><small>本月应投</small><b class="num" id="dAmt">—</b><small id="dWhen"></small></div></div></div>
    <div class="seg"><span data-z="b">底部 ×2</span><span data-z="n">中性 ×1</span><span data-z="t">顶部 ×0.5</span></div>
  </div>
  <div class="sheet">
    <button class="cta" id="dRecord" type="button">记录本月投入</button>
    <div class="h">依据</div>
    <div class="kv"><span>底部信号<small>过 75 加倍</small></span><b class="num" id="dBottom">—</b></div>
    <div class="kv"><span>长期持有者浮亏<small>过 42% 投入全部储备金</small></span><b class="num" id="dPsil">—</b></div>
    <div class="kv"><span>顶部证据<small>三项满足两项减半</small></span><b class="num" id="dTop">—</b></div>
    <div class="kv"><span>牛市后期风控</span><b id="dRisk" style="font-size:15px">—</b></div>
    <div id="cmpBox" hidden>
      <div class="h" id="cmpH">我的定投</div>
      <div class="cmp"><div class="mine"><div class="barv" id="cmpA"></div><small>我的记录</small><b class="num" id="cmpAv">—</b></div><div><div class="barv" id="cmpB"></div><small>同样的钱，每月固定投</small><b class="num" id="cmpBv">—</b></div></div>
      <div class="cmpn" id="cmpN"></div>
    </div>
    <div class="h" id="recH" hidden>买入记录</div>
    <div id="recList"></div>
    <div class="links"><button type="button" id="recExport">导出备份</button><button type="button" id="recImportBtn">导入备份</button><input type="file" id="recImport" accept=".json,application/json" hidden></div>
  </div>
</section>

<section class="view" id="vInd" hidden><div class="hero"><div class="top"><b>指标</b><span></span></div></div><div class="sheet"><div class="verdict">指标页还在做。</div><p class="meta">会放 14 个核心指标和「资料库」入口。现在可以先回 <a href="../index.html">原来的网站</a> 查看。</p></div></section>
<section class="view" id="vMe" hidden><div class="hero"><div class="top"><b>我的</b><span></span></div></div><div class="sheet"><div class="verdict">「我的」还在做。</div><p class="meta">持仓、买入记录、备份、数据健康中心会搬到这里。个人记录和原来的网站共用，不需要重新录入。<br><br>预览版 28.0.0-preview2 · <a href="../index.html">回到 V27</a></p></div></section>

<div class="modal" id="recModal" hidden><div class="panel" role="dialog" aria-label="记录本月投入">
  <h3>记录一笔买入</h3>
  <label class="f"><span>投入金额（元）</span><input id="rCny" type="number" inputmode="decimal" min="0" step="any"></label>
  <label class="f"><span>买到的 BTC</span><input id="rBtc" type="number" inputmode="decimal" min="0" step="any"></label>
  <p class="hint" id="rHint"></p>
  <label class="f"><span>日期</span><input id="rDay" type="date"></label>
  <div class="btns"><button class="cta ghost" type="button" id="rCancel">取消</button><button class="cta" type="button" id="rSave">保存</button></div>
</div></div>

<nav class="tabs" aria-label="分区">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>首页</button>
  <button type="button" data-tab="dca"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>定投</button>
  <button type="button" data-tab="ind"><svg viewBox="0 0 24 24"><path d="M4 20h16M7.5 20v-8M12 20V6M16.5 20v-6"/></svg>指标</button>
  <button type="button" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1-3.4 3.7-5 7-5s6 1.6 7 5"/></svg>我的</button>
</nav>
</div>

<script>
(function(){
"use strict";
/* ============ 小工具 ============ */
var $=function(id){return document.getElementById(id)};
var DCA_DAY=15;                                   // 每月定投日
function getJSON(url,ms){return new Promise(function(res,rej){var ctl=("AbortController" in window)?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();rej(new Error("timeout"))},ms||8000);
  fetch(url,{cache:"no-cache",signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){clearTimeout(t);res(j)},function(e){clearTimeout(t);rej(e)})})}
function money(v){return "¥"+Math.round(v).toLocaleString("en-US")}
function usdB(v){var a=Math.abs(v);return (v<0?"−":"+")+"$"+(a>=1e9?(a/1e9).toFixed(1)+"B":Math.round(a/1e6)+"M")}
function pct(v,d){return (v<0?"−":"+")+Math.abs(v).toFixed(d==null?1:d)+"%"}
var WEEK=["周日","周一","周二","周三","周四","周五","周六"];

/* ============ 数据：全部来自网站自己的文件 + 一个实时价格 ============ */
var D={state:null,core:null,stable:null,price:null,chg24:null,priceSrc:""};
function loadFiles(){
  return Promise.all([
    getJSON("../data/daily-state.json").then(function(j){D.state=j},function(){}),
    getJSON("../data/v28/core.json").then(function(j){D.core=j},function(){}),
    getJSON("../data/stablecoins.json").then(function(j){D.stable=j},function(){})
  ]);
}
// 实时价格：三家交易所谁先回来用谁；都不通就用文件里的日线价格
function loadPrice(){
  var srcs=[
    function(){return getJSON("https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT",6000).then(function(j){return{p:+j.lastPrice,c:+j.priceChangePercent,s:"Binance"}})},
    function(){return getJSON("https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT",6000).then(function(j){var d=j.data[0];return{p:+d.last,c:(+d.last/+d.open24h-1)*100,s:"OKX"}})},
    function(){return getJSON("https://api.exchange.coinbase.com/products/BTC-USD/stats",6000).then(function(j){return{p:+j.last,c:(+j.last/+j.open-1)*100,s:"Coinbase"}})}
  ];
  return new Promise(function(res){var left=srcs.length,done=false;
    srcs.forEach(function(f){f().then(function(x){if(done||!(x.p>1000))throw 0;done=true;D.price=x.p;D.chg24=isFinite(x.c)?x.c:null;D.priceSrc=x.s;res(true)}).catch(function(){if(--left===0&&!done)res(false)})})});
}

/* ============ 计算（规则与 V27 相同） ============ */
function today(){return D.state&&D.state.today||null}
function livePrice(){var t=today();return D.price||(D.core&&D.core.latest&&D.core.latest.price)||(t&&t.price)||null}
// AHR999 与价格的平方成正比：用日线算好的值按实时价格换算
function ahrNow(){var t=today(),p=livePrice();if(!t||!(t.ahr>0)||!(t.price>0)||!p)return t?t.ahr:null;return t.ahr*Math.pow(p/t.price,2)}
function ahrZone(a){return a==null?"":a<.45?"深度低估":a<1.2?"长期低估":a<5?"合理区间":"昂贵"}
function ahrPos(a){   // 标尺位置：0.2 / 0.45 / 1.2 / 5 / 20 对应 0 / 22 / 46 / 72 / 100%
  var x=[.2,.45,1.2,5,20],y=[0,22,46,72,100];if(!(a>0))return 0;if(a<=x[0])return 0;if(a>=x[4])return 100;
  for(var i=0;i<4;i++)if(a<x[i+1])return y[i]+(y[i+1]-y[i])*Math.log(a/x[i])/Math.log(x[i+1]/x[i]);return 100}
function zone(){var t=today();if(!t)return "n";return t.tb==="bottom"||t.deep?"b":(t.tb==="top"||t.tb==="topStrong")?"t":"n"}
function budget(){try{var s=JSON.parse(localStorage.getItem("btc_cost_structure_state_v1"));var b=s&&s.sigPlan&&+s.sigPlan.budget;if(b>0)return b}catch(e){}return 2000}
function dcaWhen(){var n=new Date(),d=n.getDate();if(d===DCA_DAY)return{text:"今天定投",left:0};
  if(d<DCA_DAY)return{text:DCA_DAY+" 日 · 还有 "+(DCA_DAY-d)+" 天",left:DCA_DAY-d};
  var next=new Date(n.getFullYear(),n.getMonth()+1,DCA_DAY),left=Math.round((next-new Date(n.getFullYear(),n.getMonth(),d))/864e5);return{text:"下月 "+DCA_DAY+" 日 · 还有 "+left+" 天",left:left}}
function stable30(){var s=D.stable;if(!s||!s.u||s.u.length<32)return null;var n=s.u.length-1;return (s.u[n]-s.u[n-30])+(s.c[n]-s.c[n-30])}
function chg30(){var s=D.stable,p=livePrice();if(!s||!s.p||s.p.length<32||!p)return null;var b=s.p[s.p.length-31];return b>0?(p/b-1)*100:null}

/* ============ 买入记录（V28 自己的一份，只存在本机；会把 V27 账本里的买入只读地并进来） ============ */
var REC_KEY="sg28_records_v1";
function fx(){try{var l=JSON.parse(localStorage.getItem("btc_dca_ledger_v1"));var f=l&&l.settings&&+l.settings.fallbackFx;if(f>1)return f}catch(e){}return 7.1}
function loadRecs(){var a=[];try{a=JSON.parse(localStorage.getItem(REC_KEY))||[]}catch(e){}
  // V27 账本里的 BTC 买入（type=btc：花了多少稳定币、成交价、买到多少）——只读，按 id 去重
  try{var l=JSON.parse(localStorage.getItem("btc_dca_ledger_v1")),have={};a.forEach(function(r){have[r.id]=1});
    (l&&l.orders||[]).forEach(function(o){if(o.type!=="btc"||!(o.btc>0)||have["v27:"+o.id])return;a.push({id:"v27:"+o.id,at:+o.at||Date.now(),cny:Math.round((+o.spent||0)*fx()),btc:+o.btc,src:"v27"})})}catch(e){}
  return a.filter(function(r){return r&&r.btc>0&&r.cny>=0}).sort(function(x,y){return y.at-x.at})}
function saveRecs(a){try{localStorage.setItem(REC_KEY,JSON.stringify(a.filter(function(r){return r.src!=="v27"})));return true}catch(e){alert("保存失败：本机存储不可用");return false}}
function monthKey(t){var d=new Date(t);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)}
function spentThisMonth(){var k=monthKey(Date.now());return loadRecs().filter(function(r){return monthKey(r.at)===k}).reduce(function(s,r){return s+r.cny},0)}
// 同样的钱每月固定投：从第一笔记录那个月起，每月 15 日（或之后第一个有价格的日子）按当天价格买入等额
function plainBtc(recs){var s=D.stable;if(!s||!s.p||!recs.length)return null;var total=recs.reduce(function(a,r){return a+r.cny},0),first=recs[recs.length-1].at,px={};
  s.days.forEach(function(d,i){px[d]=s.p[i]});var months=[],d=new Date(first);d=new Date(d.getFullYear(),d.getMonth(),1);var now=new Date();
  while(d<=now){months.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}
  var prices=[];months.forEach(function(m){for(var k=DCA_DAY;k<=28;k++){var key=m.getFullYear()+"-"+("0"+(m.getMonth()+1)).slice(-2)+"-"+("0"+k).slice(-2);if(px[key]>0){prices.push(px[key]);return}}
    if(m.getFullYear()===now.getFullYear()&&m.getMonth()===now.getMonth()&&livePrice())prices.push(livePrice())});
  if(!prices.length||!(total>0))return null;var each=total/prices.length;return prices.reduce(function(a,p){return a+each/fx()/p},0)}
function renderRecs(){
  var recs=loadRecs(),box=$("recList"),h=$("recH");h.hidden=!recs.length;
  var show=recs.slice(0,window.__recAll?999:5);
  box.innerHTML=show.map(function(r){var d=new Date(r.at);return '<div class="rec"><span>'+d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+'<small>'+(r.cny>0&&r.btc>0?"均价 $"+Math.round(r.cny/fx()/r.btc).toLocaleString("en-US"):"")+(r.src==="v27"?" · 来自原账本":"")+'</small></span><b class="num">'+money(r.cny)+'</b><span class="num">'+r.btc.toFixed(5)+' BTC'+(r.src==="v27"?"":'<button type="button" data-del="'+r.id+'">删除</button>')+'</span></div>'}).join("")
    +(recs.length>5&&!window.__recAll?'<button class="more" type="button" id="recMore">查看全部 '+recs.length+' 笔</button>':"");
  // 实盘对照
  var cb=$("cmpBox"),tot=recs.reduce(function(a,r){return a+r.cny},0),btc=recs.reduce(function(a,r){return a+r.btc},0),pl=plainBtc(recs);
  cb.hidden=!(recs.length>=2&&pl>0);
  if(!cb.hidden){var mx=Math.max(btc,pl),f=recs[recs.length-1];$("cmpH").textContent="我的定投 · "+monthKey(f.at)+" 至今 · 共投 "+money(tot);
    $("cmpA").style.height=Math.round(46*btc/mx)+"px";$("cmpB").style.height=Math.round(46*pl/mx)+"px";$("cmpAv").textContent=btc.toFixed(4)+" BTC";$("cmpBv").textContent=pl.toFixed(4)+" BTC";
    var d=(btc/pl-1)*100;$("cmpN").innerHTML=(d>=0?"多买到 <b>":"少买到 <b class=\"dn\">")+Math.abs(d).toFixed(1)+"%</b> · 我的均价 $"+Math.round(tot/fx()/btc).toLocaleString("en-US")}
}
function openRec(){var z=zone(),B=budget(),due=Math.max(0,B*(z==="b"?2:z==="t"?.5:1)-spentThisMonth()),p=livePrice();
  $("rCny").value=due>0?Math.round(due):"";$("rBtc").value=due>0&&p?(due/fx()/p).toFixed(6):"";
  var n=new Date();$("rDay").value=n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2);
  $("rHint").textContent=p?"按现价 $"+Math.round(p).toLocaleString("en-US")+"、汇率 "+fx()+" 预填；请改成交易所里实际买到的数量。":"请填交易所里实际买到的数量。";
  $("recModal").hidden=false}
function saveRec(){var cny=+$("rCny").value,btc=+$("rBtc").value,day=$("rDay").value;
  if(!(cny>0)||!(btc>0)){alert("请填写投入金额和买到的 BTC");return}
  var at=day?new Date(day+"T12:00:00").getTime():Date.now(),a=loadRecs();a.push({id:"r"+Date.now().toString(36),at:at,cny:Math.round(cny*100)/100,btc:btc});
  if(saveRecs(a)){$("recModal").hidden=true;renderAll()}}

/* ============ 首页 ============ */
function renderHome(){
  var n=new Date();$("hDate").textContent=(n.getMonth()+1)+" 月 "+n.getDate()+" 日 · "+WEEK[n.getDay()];
  var p=livePrice();if(p)$("hPrice").textContent=Math.round(p).toLocaleString("en-US");
  var c24=D.chg24,c30=chg30(),parts=[];
  if(c24!=null)parts.push('24 小时 <b class="'+(c24<0?"dn":"up")+'">'+pct(c24)+'</b>');
  if(c30!=null)parts.push('30 日 <b class="'+(c30<0?"dn":"up")+'">'+pct(c30)+'</b>');
  $("hChg").innerHTML=parts.join("　　");
  var a=ahrNow();$("hAhr").textContent=a==null?"—":a.toFixed(2);$("hAhrZone").textContent=ahrZone(a);$("hMark").style.left=ahrPos(a)+"%";
  var t=today(),z=zone(),risk=t&&t.risk&&t.risk!=="off",B=budget(),w=dcaWhen(),mult=z==="b"?2:z==="t"?.5:1;
  if(!t){$("hVerdict").textContent=p?"价格已更新，信号数据暂时读不到。":"数据暂时读不到。";return}
  // 一句结论
  $("hVerdict").innerHTML=risk?"风控已提示，<br>按计划减仓。":z==="b"?(t.deep?"深度底部，<br>预算加全部储备金。":"底部区，<br>加倍定投。"):z==="t"?"顶部区，<br>减半定投。":"中性区间，<br>照常定投。";
  // 底部确认 / 深度底部
  var note=$("hNote"),ps=D.core&&D.core.latest&&D.core.latest.psil,psNow=ps!=null?ps:t.psil;
  note.hidden=true;note.className="note";
  if(t.deep){note.hidden=false;note.textContent="长期持有者浮亏 "+Math.round(psNow)+"%，历史上只出现在大底"}
  else if(t.confirm){note.hidden=false;note.textContent="底部已在 "+(+String(t.confirm).slice(5,7))+" 月确认"}
  // 贵不贵
  $("q1").textContent=a==null?"—":a<.45?"很便宜":a<1.2?"偏便宜":a<5?"不便宜":"偏贵";
  var pp=D.core&&D.core.latest&&D.core.latest.pricePercentile;
  $("q1s").textContent=pp!=null?"现价高于 "+pp+"% 的持币成本":(psNow!=null?"长期持有者浮亏 "+Math.round(psNow)+"%":"");
  // 投多少
  var sp=spentThisMonth(),need=B*mult;
  $("q2").textContent=money(need);$("q2t").hidden=false;$("q2t").textContent=sp>=need*.999?"本月已投 ✓":sp>0?"已投 "+money(sp):w.text;
  $("q2s").textContent=z==="b"?(t.deep?"预算 ×2，储备金全部投入":"预算 ×2，多出的一份从储备金拿"):z==="t"?"预算 ×0.5，另一半存进储备金":"";
  // 要留意
  var st=stable30(),te=t.topEvidence;
  $("q3").textContent=risk?"牛市后期风控已提示":z==="t"?"已进入顶部区":"暂无风险信号";
  $("q3s").textContent=[te!=null?"顶部证据 "+te+" / 3":"",st!=null?"稳定币 30 天 "+usdB(st):""].filter(Boolean).join("，");
  $("hMeta").textContent="信号数据日 "+(t.day||"—")+(D.priceSrc?" · 价格 "+D.priceSrc:" · 价格为日线收盘")+"。按本站规则汇总，不构成投资建议。";
}

/* ============ 定投页 ============ */
function renderDca(){
  var n=new Date(),t=today(),z=zone(),B=budget(),mult=z==="b"?2:z==="t"?.5:1,w=dcaWhen();
  $("dMonth").textContent=n.getFullYear()+" 年 "+(n.getMonth()+1)+" 月";
  $("dZone").textContent=t?(t.deep?"深度底部":z==="b"?"底部区":z==="t"?"顶部区":"中性区间"):"";
  var sp=spentThisMonth(),need=B*mult,done=sp>=need*.999;
  $("dAmt").textContent=money(need);$("dWhen").textContent=done?"本月已投 ✓":sp>0?"已投 "+money(sp)+" · 还差 "+money(need-sp):w.text;
  $("dArc").setAttribute("stroke-dasharray",(sp>0?Math.min(1,sp/need)*282.7:.1).toFixed(1)+" 283");
  $("dRecord").textContent=done?"再记一笔":"记录本月投入";renderRecs();
  document.querySelectorAll(".seg span").forEach(function(s){s.classList.toggle("on",s.dataset.z===z)});
  if(!t)return;
  $("dBottom").textContent=t.score==null?"—":Math.round(100-t.score);
  var ps=D.core&&D.core.latest&&D.core.latest.psil!=null?D.core.latest.psil:t.psil;$("dPsil").textContent=ps==null?"—":Math.round(ps)+"%";
  $("dTop").textContent=t.topEvidence==null?"—":t.topEvidence+" / 3";
  var rk=$("dRisk"),on=t.risk&&t.risk!=="off";rk.textContent=on?"已提示":"未启动";rk.style.color=on?"var(--neg)":"var(--ink3)";
}

/* ============ 导航 ============ */
var VIEWS={home:"vHome",dca:"vDca",ind:"vInd",me:"vMe"};
function show(tab){if(!VIEWS[tab])tab="home";Object.keys(VIEWS).forEach(function(k){$(VIEWS[k]).hidden=k!==tab});
  document.querySelectorAll(".tabs button").forEach(function(b){var on=b.dataset.tab===tab;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
  window.scrollTo(0,0);try{history.replaceState(null,"","#"+tab)}catch(e){}}
document.addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b)return show(b.dataset.tab);var g=e.target.closest("[data-go]");if(g)show(g.dataset.go)});
$("dRecord").addEventListener("click",openRec);$("rCancel").addEventListener("click",function(){$("recModal").hidden=true});$("rSave").addEventListener("click",saveRec);
$("recModal").addEventListener("click",function(e){if(e.target===this)this.hidden=true});
document.addEventListener("click",function(e){var d=e.target.closest("[data-del]");if(d){if(confirm("删除这笔记录？")){saveRecs(loadRecs().filter(function(r){return r.id!==d.dataset.del}));renderAll()}return}
  if(e.target.id==="recMore"){window.__recAll=true;renderRecs()}});
$("recExport").addEventListener("click",function(){var data={app:"Sats Garden",kind:"v28-records",at:new Date().toISOString(),records:loadRecs()},blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),name="SatsGarden-买入记录-"+new Date().toISOString().slice(0,10)+".json",f;
  try{f=new File([blob],name,{type:"application/json"})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1500)});
$("recImportBtn").addEventListener("click",function(){$("recImport").click()});
$("recImport").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.kind!=="v28-records"||!Array.isArray(d.records))throw 0;
    var cur=loadRecs(),have={};cur.forEach(function(x){have[x.id]=1});var add=d.records.filter(function(x){return x&&x.btc>0&&!have[x.id]&&x.src!=="v27"});
    if(!confirm("导入 "+add.length+" 笔新记录？（已有的不会重复）"))return;saveRecs(cur.concat(add));renderAll()}catch(err){alert("不是 Sats Garden 的买入记录备份")}};r.readAsText(f);e.target.value=""});

function renderAll(){renderHome();renderDca()}
show((location.hash||"").slice(1)||"home");
renderAll();
loadFiles().then(renderAll);
loadPrice().then(renderAll);
setInterval(function(){if(document.visibilityState==="visible")loadPrice().then(renderAll)},60000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){loadPrice().then(renderAll);loadFiles().then(renderAll)}});
})();
</script>
