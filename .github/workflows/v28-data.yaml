# V28 同源加速层：每 6 小时把主站、AHR999 专页与个人定投账本使用的核心 Bitview 数据与 URPD 分布算好，
# 写入 data/v28/core.json 与 data/v28/charts.json。浏览器同源秒开，过期或手动点击「更新」时自动回退直连 Bitview。
name: V28 data

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v28-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build data
        run: python3 tools/v28_build_data.py data/v28
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/v28
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: v28 $(date -u +%F-%H)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
