# V28 数据层：每 6 小时把 V28 网页要用的 Bitview 数据算好，写到 data/v28/core.json 与 data/v28/charts.json。
# V27 不读这两个文件，现在跑起来只是让数据先攒着、有问题早发现。
name: V28 data

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v28-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build data
        run: python3 tools/v28_build_data.py data/v28
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/v28
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: v28 $(date -u +%F-%H)"
          git pull --rebase --autostash
          git push
