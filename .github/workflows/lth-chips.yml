# 每天预先计算 LTH 筹码集中度 ±10%，结果写入 data/lth-chips.json。
# 网页打开时先读这份文件，只补算缺少的最新一两天。
name: Precompute LTH chips

on:
  schedule:
    - cron: "20 1 * * *"   # 每天 UTC 01:20（北京时间 09:20）
  workflow_dispatch:        # 也可以在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: lth-chips
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compute
        run: python3 tools/precompute_lth_chips.py data/lth-chips.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/lth-chips.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: LTH chips $(date -u +%F)"
          git pull --rebase --autostash
          git push
